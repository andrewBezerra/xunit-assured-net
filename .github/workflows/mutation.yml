name: Mutation

# Testes de mutação (#128): o Stryker.NET muda o código de propósito -- troca um == por !=,
# apaga uma chamada -- e roda a suíte. Um mutante que sobrevive é uma mudança de comportamento
# que nenhum teste percebe. Até a 6.10 isso era feito à mão, a cada mudança, e dependia de
# alguém lembrar e escolher uma boa mutação.
#
# Não roda em PR: é lento. Roda de madrugada e quando chamado à mão. Sem limite de nota
# (break 0, em src/XUnitAssured.Tests/stryker-config.json): os mutantes sobreviventes são o
# sinal; a nota, virando meta, deixaria de medir o que mede.

on:
  schedule:
    - cron: '0 6 * * *'   # 03:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  mutation:
    name: Mutation (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: XUnitAssured.Core
            extra: ''
          # Os exemplos HTTP locais são a única suíte que manda um pedido por um HttpClient
          # próprio com cada tipo de autenticação (#144). O projeto é só net8.0, e o Stryker
          # roda os testes num framework só, então o job do Http roda no net8.0.
          - project: XUnitAssured.Http
            extra: >-
              --target-framework net8.0
              --test-project XUnitAssured.Tests.csproj
              --test-project ../XUnitAssured.Http.Samples.Local.Test/XUnitAssured.Http.Samples.Local.Test.csproj
          # Kafka e RabbitMq (#159): o que fala com o broker está nos testes Requires=Broker, fora
          # do filtro, e aparece como sem cobertura. Isso mede quanto a suíte offline alcança.
          - project: XUnitAssured.Kafka
            extra: ''
          - project: XUnitAssured.RabbitMq
            extra: ''
          # Camunda: o SdkCamundaGateway só roda nos testes Requires=Camunda e aparece sem
          # cobertura; o resto (verbos, mocks, asserções) roda contra o ClusterFalso.
          - project: XUnitAssured.Camunda
            extra: ''

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # O projeto de testes compila para os três; o Stryker roda no net10.0 (stryker-config.json),
      # menos o Http, no net8.0 (acima).
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Stryker
        working-directory: src/XUnitAssured.Tests
        run: dotnet stryker --project ${{ matrix.project }}.csproj ${{ matrix.extra }} --output "${{ github.workspace }}/mutation/${{ matrix.project }}"

      # O relatório em markdown vai para o resumo da execução; o HTML, com cada mutante
      # sobrevivente no código, vai como artefato.
      - name: Summary
        if: always()
        run: |
          relatorio=$(find "mutation/${{ matrix.project }}" -name '*.md' 2>/dev/null | head -1)
          if [ -n "$relatorio" ]; then cat "$relatorio" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-${{ matrix.project }}
          path: mutation/${{ matrix.project }}
          if-no-files-found: ignore
