# Análise estática: Semgrep (segurança) e SonarCloud (qualidade, segurança e cobertura).
#
# Semgrep Community Edition, com os pacotes públicos de regras, sem conta e sem enviar o código
# (--metrics=off). Na PR, reprova só o que a PR introduz (--baseline-commit): o que já estava na
# main não bloqueia ninguém. No push na main, a varredura é completa, não reprova, e vai para o
# code scanning do GitHub (aba Security), que em repositório público é gratuito.
#
# Medido em 2026-10-16, antes deste workflow: 30 achados.
#   - 29 actions referenciadas por tag, e não por SHA: corrigidos junto com este workflow.
#   - A chave privada da CA de exemplo do Kafka com SSL (src/XUnitAssured.Kafka.Samples.Remote.Test/
#     docker/KRaft-SASLSSL/secrets/ca-key): verdadeiro positivo, tratado à parte.
#
# SonarCloud, gratuito para repositório público, nos runners do GitHub. Não usa o SonarQube da
# .115 como o LiaisonHub: lá o job roda num runner self-hosted, e num repositório público um runner
# self-hosted deixaria a PR de um fork rodar código naquela máquina. Não reprova: o resultado é o
# comentário na PR e o quality gate no SonarCloud. Sem o secret SONAR_TOKEN (PR de fork, ou antes
# de o projeto existir no SonarCloud), o job passa sem analisar.

name: SAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # O envio do SARIF para o code scanning.
      security-events: write
    container:
      image: semgrep/semgrep:1.181.0
    env:
      REGRAS: --config p/csharp --config p/secrets --config p/github-actions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # A linha de base é um commit da main: a PR precisa do histórico.
          fetch-depth: 0

      # O checkout roda fora do contêiner, com outro dono; sem isto o git recusa o repositório e a
      # linha de base falha.
      - name: Mark the repository as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: New findings of the pull request
        if: github.event_name == 'pull_request'
        run: |
          semgrep scan $REGRAS --metrics=off --error \
            --baseline-commit "${{ github.event.pull_request.base.sha }}" \
            --text-output=semgrep.txt

      - name: Full scan
        if: github.event_name != 'pull_request'
        run: semgrep scan $REGRAS --metrics=off --text-output=semgrep.txt --sarif-output=semgrep.sarif

      - name: Upload to code scanning
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Summary
        if: always()
        run: |
          {
            echo '## Semgrep'
            echo
            if [ -s semgrep.txt ]; then
              echo '```'
              cat semgrep.txt
              echo '```'
            else
              echo 'No findings.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Os nomes que o SonarCloud dá ao importar o repositório; uma variável do repositório os troca.
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'andrewbezerra' }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'andrewBezerra_xunit-assured-net' }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: No token, no analysis
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN is not available (a fork's pull request, or the SonarCloud project is not set up yet); skipping the analysis."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.SONAR_TOKEN != ''
        with:
          # O Sonar usa o histórico para o blame e para saber o que é código novo.
          fetch-depth: 0

      # Os três, como no CI: o build da solução compila todos os alvos.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        if: env.SONAR_TOKEN != ''
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install the scanner
        if: env.SONAR_TOKEN != ''
        run: dotnet tool update dotnet-sonarscanner --version 11.3.0 --tool-path "$RUNNER_TEMP/sonar"

      - name: Begin the analysis
        if: env.SONAR_TOKEN != ''
        env:
          PR_NUMERO: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          # Os spikes são rascunhos de investigação, fora do produto. Os exemplos e as apps de
          # exemplo são analisados, mas não contam na cobertura: só os testes de unidade rodam aqui.
          set -- /k:"$SONAR_PROJECT_KEY" /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url="https://sonarcloud.io" /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.exclusions="spikes/**" \
            /d:sonar.coverage.exclusions="src/*Samples*/**,src/SampleWebApi/**,src/SampleWebApp/**"
          if [ -n "$PR_NUMERO" ]; then
            set -- "$@" /d:sonar.pullrequest.key="$PR_NUMERO" \
              /d:sonar.pullrequest.branch="$PR_BRANCH" /d:sonar.pullrequest.base="$PR_BASE"
          fi
          "$RUNNER_TEMP/sonar/dotnet-sonarscanner" begin "$@"

      # Os mesmos testes que o CI exige, só no net10, com cobertura.
      - name: Build and test with coverage
        if: env.SONAR_TOKEN != ''
        run: |
          dotnet build src/XUnitAssured.Net.sln --configuration Release
          dotnet test src/XUnitAssured.Tests/XUnitAssured.Tests.csproj --configuration Release --no-build --framework net10.0 \
            --filter "Requires!=Network&Requires!=Broker&Requires!=Browser&Requires!=Camunda&Requires!=Docker" \
            --collect:"XPlat Code Coverage;Format=opencover" --results-directory TestResults

      - name: End the analysis
        if: always() && env.SONAR_TOKEN != ''
        run: '"$RUNNER_TEMP/sonar/dotnet-sonarscanner" end /d:sonar.token="$SONAR_TOKEN"'
