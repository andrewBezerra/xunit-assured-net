name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION: src/XUnitAssured.Net.sln
  UNIT_TESTS: src/XUnitAssured.Tests/XUnitAssured.Tests.csproj

jobs:
  # Portão de versão: toda PR para main sobe o <Version> de src/Directory.Build.props
  # e escreve docs/releases/<versão>.md, porque o merge publica (release.yml). Só lê.
  # Mesma regra do LiaisonHub.Api; o script é o mesmo que o release.yml usa.
  versao:
    name: Versão nova
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth 0: sem as tags, "a versão já tem tag?" responderia sempre que não.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conferir a versão
        run: bash .github/scripts/conferir-versao.sh conferir

  # The gating job: builds every project and runs the deterministic test suite on
  # each target framework. Nothing here depends on a network service, a broker or a
  # browser, so a red result always means the code is broken.
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # Every targeted runtime, not just the newest: building a target only needs its
      # targeting pack, but running its tests needs the matching runtime installed.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      # Builds the whole solution, samples included, so a compile break in a sample
      # project is caught here rather than by whoever opens it next.
      - name: Build
        id: build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      # The unit test project, and the HTTP local samples below. The other sample test
      # projects need a live API, a Kafka broker or a browser, so they are not gating
      # material.
      - name: Test (net8.0)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test ${{ env.UNIT_TESTS }} --configuration Release --no-build --framework net8.0 --filter "Requires!=Network&Requires!=Broker&Requires!=Browser&Requires!=Camunda&Requires!=Docker" --logger "trx;LogFileName=net8.0.trx" --results-directory TestResults

      - name: Test (net9.0)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test ${{ env.UNIT_TESTS }} --configuration Release --no-build --framework net9.0 --filter "Requires!=Network&Requires!=Broker&Requires!=Browser&Requires!=Camunda&Requires!=Docker" --logger "trx;LogFileName=net9.0.trx" --results-directory TestResults

      - name: Test (net10.0)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test ${{ env.UNIT_TESTS }} --configuration Release --no-build --framework net10.0 --filter "Requires!=Network&Requires!=Broker&Requires!=Browser&Requires!=Camunda&Requires!=Docker" --logger "trx;LogFileName=net10.0.trx" --results-directory TestResults

      # In process (WebApplicationFactory over SampleWebApi), no network. The only
      # suite that sends a request through a custom HttpClient with each kind of
      # authentication (#144). The project targets net8.0.
      - name: Test (HTTP local samples)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test src/XUnitAssured.Http.Samples.Local.Test/XUnitAssured.Http.Samples.Local.Test.csproj --configuration Release --no-build --logger "trx;LogFileName=http-samples.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: warn

  # Tests that call public internet services (jsonplaceholder.typicode.com,
  # httpbin.org). They exercise real behaviour worth keeping, but an outage of
  # someone else's service must never block a pull request — hence a separate,
  # non-blocking job.
  network-tests:
    name: Network-dependent tests (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test against live services
        run: dotnet test ${{ env.UNIT_TESTS }} --configuration Release --framework net10.0 --filter "Requires=Network"

  # A regressao que a 6.0.0 publicou passou por 916 testes sem broker: um verbo depois da acao
  # criava uma execucao extra, e so publicar e consumir de verdade mostrou. Este trabalho existe
  # para que essa classe de defeito apareca antes de ser publicada.
  #
  # Nao bloqueante de proposito: broker de servico depende de infraestrutura do runner, e uma
  # falha de infraestrutura nao deve derrubar o PR de quem mexeu noutra coisa.
  broker-round-trip:
    name: Broker round trip (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      rabbitmq:
        image: rabbitmq:4
        # O usuario guest do RabbitMQ so aceita conexao da propria maquina, e um contendor de
        # servico e alcancado pela rede do Docker, entao um usuario proprio e obrigatorio.
        env:
          RABBITMQ_DEFAULT_USER: xa
          RABBITMQ_DEFAULT_PASS: xa-senha
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Round trip against a real broker
        env:
          XA_RABBITMQ_URI: amqp://xa:xa-senha@127.0.0.1:5672/
        run: dotnet test ${{ env.UNIT_TESTS }} --configuration Release --framework net10.0 --filter "Requires=Broker"

  # O XUnitAssured.Camunda contra um Camunda 8.10 de verdade: que o motor aceita completar um job
  # que ninguem ativou, que a busca acha a instancia filha, que o mapeamento de saida da call
  # activity roda. Sem arquivo de configuracao (um contendor de servico nao monta nada do
  # repositorio): tudo por variavel, H2 em memoria e flush imediato, como o Camunda Process Test.
  # Validado com estas mesmas variaveis num contendor descartavel em 2026-10-16: pronto em ~34 s.
  #
  # Nao bloqueante pelo mesmo motivo do broker.
  camunda-round-trip:
    name: Camunda round trip (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      camunda:
        image: camunda/camunda:8.10.4
        env:
          CAMUNDA_DATA_SECONDARYSTORAGE_TYPE: rdbms
          CAMUNDA_DATA_SECONDARYSTORAGE_RDBMS_URL: jdbc:h2:mem:xa;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
          CAMUNDA_DATA_SECONDARYSTORAGE_RDBMS_USERNAME: sa
          CAMUNDA_DATA_SECONDARYSTORAGE_RDBMS_FLUSHINTERVAL: PT0S
          CAMUNDA_SECURITY_AUTHENTICATION_METHOD: basic
          CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTEDAPI: "false"
          CAMUNDA_SECURITY_AUTHORIZATIONS_ENABLED: "false"
          CAMUNDA_SECURITY_INITIALIZATION_USERS_0_USERNAME: xa
          CAMUNDA_SECURITY_INITIALIZATION_USERS_0_PASSWORD: xa-senha
          CAMUNDA_SECURITY_INITIALIZATION_USERS_0_NAME: xa
          CAMUNDA_SECURITY_INITIALIZATION_USERS_0_EMAIL: xa@localhost
        ports:
          - 8080:8080

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Esperar aqui, e nao num --health-cmd do servico: a imagem nao tem curl, e o comando do
      # compose oficial precisaria de tres niveis de aspas. O runner tem curl, e este pedido e o
      # mesmo que os testes fazem primeiro.
      - name: Wait for Camunda
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -u xa:xa-senha http://127.0.0.1:8080/v2/topology >/dev/null 2>&1; then
              echo "Camunda ready after ~$((i * 5)) s"; exit 0
            fi
            sleep 5
          done
          echo "::error::Camunda did not answer /v2/topology within 5 minutes"; exit 1

      - name: Round trip against a real Camunda
        env:
          CAMUNDA_REST_ADDRESS: http://127.0.0.1:8080
          CAMUNDA_BASIC_AUTH_USERNAME: xa
          CAMUNDA_BASIC_AUTH_PASSWORD: xa-senha
        run: dotnet test ${{ env.UNIT_TESTS }} --configuration Release --framework net10.0 --filter "Requires=Camunda"

  # O modo gerenciado do XUnitAssured.Camunda.Testcontainers: o proprio dotnet test sobe o
  # Camunda no Docker do runner, sem servico declarado aqui. E a prova de que uma empresa so
  # precisa de um runner com Docker. Nao bloqueante pelo mesmo motivo dos outros: depende de
  # baixar uma imagem de ~1 GB.
  camunda-testcontainers:
    name: Camunda Testcontainers (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Camunda started by dotnet test
        run: dotnet test ${{ env.UNIT_TESTS }} --configuration Release --framework net10.0 --filter "Requires=Docker"

  # Interceptar rota e fazer requisicao de dentro da pagina so se prova num navegador de
  # verdade, com duas origens de verdade: SameSite, o Path do cookie e o CORS com credenciais
  # nao existem fora dele. Os testes sobem o proprio servidor local; o que este trabalho traz e
  # o Chromium.
  #
  # Nao bloqueante pelo mesmo motivo do broker: baixar e instalar navegador depende do runner.
  browser-tests:
    name: Browser tests (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build ${{ env.UNIT_TESTS }} --configuration Release --framework net10.0

      - name: Install Chromium
        run: pwsh src/XUnitAssured.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Tests in a real browser
        run: dotnet test ${{ env.UNIT_TESTS }} --configuration Release --no-build --framework net10.0 --filter "Requires=Browser"

  # Proves every package actually packs, and keeps the artifacts so a release
  # candidate can be inspected before any tag is cut.
  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v4
        with:
          # SourceLink embeds commit information, which needs full history.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      # The projects set GeneratePackageOnBuild, so the build itself produces the
      # packages. Running `dotnet pack` without building first makes pack collect
      # outputs that do not exist yet and fail with NU5026 — invisible on a machine
      # whose bin/ is still populated from an earlier build, but fatal on a clean
      # checkout. Build explicitly, then pack what was built.
      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Pack
        run: dotnet pack ${{ env.SOLUTION }} --configuration Release --no-build --output artifacts

      - name: List produced packages
        run: ls -la artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
