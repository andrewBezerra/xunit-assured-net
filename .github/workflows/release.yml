name: Release

# Cutting a tag builds and verifies the packages, but publishing waits for a human.
#
# Authentication uses Trusted Publishing, so no nuget.org API key is stored here.
# The job proves its identity with a short-lived OIDC token issued by GitHub, which
# nuget.org exchanges for an API key valid for one hour. Nothing long-lived exists
# to leak or rotate.
#
# One-time setup, already in place for this repository:
#
#   1. nuget.org > your username > Trusted Publishing > add a policy:
#        Repository Owner: andrewBezerra
#        Repository:       xunit-assured-net
#        Workflow File:    release.yml        (file name only, no path)
#        Environment:      nuget-release
#      The Environment field must match the `environment:` of the publish job
#      below, or nuget.org rejects the token.
#
#   2. Settings > Environments > nuget-release, with "Required reviewers".
#      This, not anything in this file, is what makes publishing wait for a human.
#      "Allow administrators to bypass" is off, so the approval cannot be skipped.
#
#   3. Repository secret NUGET_USER — the nuget.org profile name, not an email
#      address. It is an identifier rather than a credential, but nuget.org
#      recommends keeping it out of the logs.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 5.0.1). Defaults to the version in Directory.Build.props.'
        required: false
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: src/XUnitAssured.Net.sln
  UNIT_TESTS: src/XUnitAssured.Tests/XUnitAssured.Tests.csproj

jobs:
  # A tag must not be publishable unless it passes the same bar as a pull request.
  verify:
    name: Build, test & pack
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # SourceLink embeds commit information, which needs full history.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Test (net7.0)
        run: dotnet test ${{ env.UNIT_TESTS }} --configuration Release --no-build --framework net7.0 --filter "Requires!=Network"

      - name: Test (net8.0)
        run: dotnet test ${{ env.UNIT_TESTS }} --configuration Release --no-build --framework net8.0 --filter "Requires!=Network"

      - name: Test (net9.0)
        run: dotnet test ${{ env.UNIT_TESTS }} --configuration Release --no-build --framework net9.0 --filter "Requires!=Network"

      - name: Test (net10.0)
        run: dotnet test ${{ env.UNIT_TESTS }} --configuration Release --no-build --framework net10.0 --filter "Requires!=Network"

      - name: Pack
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            dotnet pack ${{ env.SOLUTION }} --configuration Release --output artifacts -p:Version=${{ inputs.version }}
          else
            dotnet pack ${{ env.SOLUTION }} --configuration Release --output artifacts
          fi

      # A tag that disagrees with the version in the build is almost always a
      # mistake, and it would publish under a version nobody intended.
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package=$(ls artifacts/XUnitAssured.Core.*.nupkg | head -1)
          package_version=$(basename "$package" .nupkg | sed 's/^XUnitAssured\.Core\.//')

          echo "Tag version:     $tag_version"
          echo "Package version: $package_version"

          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match packaged version '$package_version'. Update <Version> in src/Directory.Build.props, or retag."
            exit 1
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  # Gated by the 'nuget-release' environment. Publishing to nuget.org cannot be
  # undone — a package version is permanent once listed — so this waits for an
  # explicit approval in the GitHub UI.
  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: verify
    environment: nuget-release

    permissions:
      # Lets this job request the OIDC token that nuget.org exchanges for a
      # short-lived API key. Nothing else needs write access.
      contents: read
      id-token: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The issued key lasts one hour, so it is requested immediately before the
      # push rather than at the start of the job.
      - name: Exchange the OIDC token for a short-lived NuGet key
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # --skip-duplicate keeps a partial re-run from failing on packages that
      # already went out in an earlier attempt.
      - name: Push to NuGet
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
