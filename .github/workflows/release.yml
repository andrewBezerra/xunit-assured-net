name: Release

# O merge em main publica, na ordem: confere a versão, compila e testa, cria a tag
# v<versão> e a release do GitHub com docs/releases/<versão>.md, e só então publica
# no NuGet — e a publicação ainda espera uma aprovação humana.
#
# A mesma regra do LiaisonHub.Api (decidida em 07/10/2026): publicar é decidir uma
# versão. A PR sobe o <Version> e escreve o registro da versão; o portão de PR do
# ci.yml já reprova uma PR que não faz isso, e este workflow reprova de novo, antes
# de qualquer tag, se uma passar mesmo assim. As regras vivem em
# .github/scripts/conferir-versao.sh, compartilhado com o ci.yml.
#
# A tag é criada aqui, e não à mão, porque a ordem importa: uma tag criada pelo
# GITHUB_TOKEN não dispara outro workflow, então "tag → release → NuGet" só é
# garantido dentro do mesmo workflow. Até a 6.1.0 as tags eram criadas à mão e
# disparavam este arquivo; nenhuma virou release no GitHub.
#
# Rodar de novo (re-run ou workflow_dispatch) não é erro: se a tag já aponta para
# este commit, a release é a mesma e o passo só confere; --skip-duplicate cuida do
# NuGet.
#
# Authentication uses Trusted Publishing, so no nuget.org API key is stored here.
# The job proves its identity with a short-lived OIDC token issued by GitHub, which
# nuget.org exchanges for an API key valid for one hour. Nothing long-lived exists
# to leak or rotate.
#
# One-time setup, already in place for this repository:
#
#   1. nuget.org > your username > Trusted Publishing > add a policy:
#        Repository Owner: andrewBezerra
#        Repository:       xunit-assured-net
#        Workflow File:    release.yml        (file name only, no path)
#        Environment:      nuget-release
#      The Environment field must match the `environment:` of the publish job
#      below, or nuget.org rejects the token.
#
#   2. Settings > Environments > nuget-release, with "Required reviewers".
#      This, not anything in this file, is what makes publishing wait for a human.
#      "Allow administrators to bypass" is off, so the approval cannot be skipped.
#
#   3. Repository secret NUGET_USER — the nuget.org profile name, not an email
#      address. It is an identifier rather than a credential, but nuget.org
#      recommends keeping it out of the logs.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: src/XUnitAssured.Net.sln
  UNIT_TESTS: src/XUnitAssured.Tests/XUnitAssured.Tests.csproj

jobs:
  # Antes de compilar qualquer coisa: a versão é nova e tem registro? Um merge sem
  # versão nova para aqui, e nada é empacotado nem publicado.
  versao:
    name: Versão nova
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      versao: ${{ steps.regras.outputs.versao }}
      tag: ${{ steps.regras.outputs.tag }}
      registro: ${{ steps.regras.outputs.registro }}
      ja_existe: ${{ steps.regras.outputs.ja_existe }}

    steps:
      # fetch-depth 0: sem as tags, "a versão já tem tag?" responderia sempre que não.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conferir a versão
        id: regras
        run: bash .github/scripts/conferir-versao.sh publicar

  # A version must not be publishable unless it passes the same bar as a pull request.
  verify:
    name: Build, test & pack
    runs-on: ubuntu-latest
    needs: versao

    steps:
      - uses: actions/checkout@v4
        with:
          # SourceLink embeds commit information, which needs full history.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      # O filtro tem de excluir os três traits. Requires=Broker exige um broker de serviço e
      # Requires=Browser um navegador instalado, que existem no ci.yml e não aqui: uma release não
      # deve depender de infraestrutura de runner para decidir se publica. Quando a v6.1.0 foi
      # cortada, este arquivo ainda filtrava só Requires!=Network e a release falhou nos onze
      # testes de ida e volta.
      - name: Test (net8.0)
        run: dotnet test ${{ env.UNIT_TESTS }} --configuration Release --no-build --framework net8.0 --filter "Requires!=Network&Requires!=Broker&Requires!=Browser"

      - name: Test (net9.0)
        run: dotnet test ${{ env.UNIT_TESTS }} --configuration Release --no-build --framework net9.0 --filter "Requires!=Network&Requires!=Broker&Requires!=Browser"

      - name: Test (net10.0)
        run: dotnet test ${{ env.UNIT_TESTS }} --configuration Release --no-build --framework net10.0 --filter "Requires!=Network&Requires!=Broker&Requires!=Browser"

      # --no-build packs exactly what was compiled and tested above. Without it,
      # pack races the build it would trigger and fails with NU5026 on a clean
      # checkout, where nothing is in bin/ yet.
      - name: Pack
        run: dotnet pack ${{ env.SOLUTION }} --configuration Release --no-build --output artifacts

      # The version checked above and the one the packages carry must be the same,
      # or the tag would name a version nobody packed.
      - name: Check the packages carry the checked version
        env:
          VERSAO: ${{ needs.versao.outputs.versao }}
        run: |
          package=$(ls artifacts/XUnitAssured.Core.*.nupkg | head -1)
          package_version=$(basename "$package" .nupkg | sed 's/^XUnitAssured\.Core\.//')

          echo "Checked version: $VERSAO"
          echo "Package version: $package_version"

          if [ "$VERSAO" != "$package_version" ]; then
            echo "::error::The packages carry '$package_version', but the version check read '$VERSAO'."
            exit 1
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  # Tag anotada e release do GitHub, depois do build e antes do NuGet: o que está
  # no NuGet sempre tem tag e release. O corpo da release é docs/releases/<versão>.md.
  release:
    name: Tag e release
    runs-on: ubuntu-latest
    needs: [versao, verify]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar a tag e a release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ needs.versao.outputs.versao }}
          TAG: ${{ needs.versao.outputs.tag }}
          REGISTRO: ${{ needs.versao.outputs.registro }}
          JA_EXISTE: ${{ needs.versao.outputs.ja_existe }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$JA_EXISTE" != "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$COMMIT" -m "$VERSAO"
            git push origin "refs/tags/$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release $TAG já existe."
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$REGISTRO"
          fi
          echo "Release: $(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"

  # Gated by the 'nuget-release' environment. Publishing to nuget.org cannot be
  # undone — a package version is permanent once listed — so this waits for an
  # explicit approval in the GitHub UI.
  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: release
    environment: nuget-release

    permissions:
      # Lets this job request the OIDC token that nuget.org exchanges for a
      # short-lived API key. Nothing else needs write access.
      contents: read
      id-token: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The issued key lasts one hour, so it is requested immediately before the
      # push rather than at the start of the job.
      - name: Exchange the OIDC token for a short-lived NuGet key
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # --skip-duplicate keeps a partial re-run from failing on packages that
      # already went out in an earlier attempt.
      - name: Push to NuGet
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
